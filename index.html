<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Samaflux</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

<div id="auth-container">
  <div id="auth">
    <h2>Log in to Samaflux</h2>

    <input id="loginEmail" type="email" placeholder="Email address"/>
    <input id="loginPassword" type="password" placeholder="Password"/>

    <button id="loginBtn" onclick="login()">
      <span class="btn-text">Log In</span>
      <span class="spinner"></span>
    </button>

    <div class="divider">or</div>

    <h3>Create an account</h3>
    <input id="regEmail" type="email" placeholder="Email address"/>
    <input id="regPassword" type="password" placeholder="Password"/>

    <button id="registerBtn" class="secondary" onclick="register()">
      <span class="btn-text">Sign Up</span>
      <span class="spinner"></span>
    </button>
  </div>
</div>

<div id="dashboard-container" style="display:none">

  <header class="topbar">
    <h1>Samaflux</h1>
    <div class="top-actions">
      <button id="addBtn" class="ghost" onclick="addMoney()">Add money</button>
      <button id="sendBtn" class="ghost" onclick="sendMoney()">Send</button>
      <button class="ghost" onclick="receiveMoney()">Request</button>
      <button class="logout" onclick="logout()">Log out</button>
    </div>
  </header>

  <section class="balance-card">
    <p class="label">Available balance</p>
    <h2>₦<span id="balance">0</span></h2>
  </section>

  <section class="cards">
    <div class="card">
      <h3>Add money</h3>
      <input id="amount" type="number" placeholder="Amount (₦)"/>
    </div>

    <div class="card">
      <h3>Send money</h3>
      <input id="sendEmail" type="email" placeholder="Recipient email"/>
      <input id="sendAmount" type="number" placeholder="Amount (₦)"/>
    </div>
  </section>

  <section class="transactions">
    <h3>Recent activity</h3>
    <ul id="history"></ul>
  </section>

</div>

<div id="toast-container"></div>

<script src="app.js"></script>
</body>
</html>
