<!DOCTYPE html>
<html>
<head>
  <title>Samaflux</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    input { display: block; margin: 5px 0; padding: 8px; width: 200px; }
    button { margin: 5px 0; padding: 8px 12px; }
    #dashboard { margin-top: 20px; }
    h2, h3 { margin-bottom: 10px; }
    ul { padding-left: 20px; }
  </style>
</head>

<body>

<div id="auth">
  <h2>Login</h2>
  <input id="loginEmail" placeholder="Email">
  <input id="loginPassword" type="password" placeholder="Password">
  <button onclick="login()">Login</button>

  <h3>Register</h3>
  <input id="regEmail" placeholder="Email">
  <input id="regPassword" type="password" placeholder="Password">
  <button onclick="register()">Register</button>
</div>

<div id="dashboard" style="display:none">
  <h2>Dashboard</h2>
  <p>Email: <span id="userEmail"></span></p>
  <p>Balance: ₦<span id="balance">0</span></p>

  <h3>Add Money</h3>
  <input id="amount" type="number" placeholder="Amount">
  <button onclick="addMoney()">Add Money</button>

  <h3>Send Money</h3>
  <input id="sendEmail" type="email" placeholder="Recipient Email">
  <input id="sendAmountValue" type="number" placeholder="Amount to Send">
  <button onclick="sendMoney()">Send Money</button>

  <h3>Transactions</h3>
  <ul id="history"></ul>

  <button onclick="logout()">Logout</button>
</div>

<script src="app.js"></script>
</body>
</html>
