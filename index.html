<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Samaflux Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- AUTH -->
<div id="auth-container">
  <div id="auth">
    <h2>Login</h2>
    <input id="loginEmail" type="email" placeholder="Email" />
    <input id="loginPassword" type="password" placeholder="Password" />
    <button onclick="login()">Login</button>

    <h3>Register</h3>
    <input id="regEmail" type="email" placeholder="Email" />
    <input id="regPassword" type="password" placeholder="Password" />
    <button onclick="register()">Register</button>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard-container" style="display:none">

  <header class="top-bar">
    <h1>Samaflux</h1>

    <div class="top-actions">
      <button class="ghost-btn" onclick="openReceive()">Receive</button>
      <button class="ghost-btn" onclick="openSend()">Send</button>
      <button class="primary-btn" onclick="openAdd()">Add Money</button>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
  </header>

  <section class="cards">

    <div class="card balance-card">
      <h3>Balance</h3>
      <p class="balance-amount">₦<span id="balance">0</span></p>
    </div>

    <div class="card">
      <h3>Quick Actions</h3>

      <input id="amount" type="number" placeholder="Amount to add" />

      <hr />

      <input id="sendEmail" type="email" placeholder="Recipient Email" />
      <input id="sendAmount" type="number" placeholder="Amount to send" />
    </div>

  </section>

  <section class="transactions">
    <h3>Transaction History</h3>
    <ul id="history"></ul>
  </section>

</div>

<script src="app.js"></script>
</body>
</html>
