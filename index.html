<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SamaFlux</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css?v=4.1">
</head>
<body>

<!-- LOGIN -->
<div id="auth-container">
  <div class="card auth-card">
    <h2>Log in</h2>

    <input id="loginEmail" type="email" placeholder="Email">
    <input id="loginPassword" type="password" placeholder="Password">

    <button id="loginBtn">Log in</button>

    <button id="goSignup" class="link-btn">Create account</button>
  </div>
</div>

<!-- SIGNUP STEP 1 -->
<div id="signup-step1" style="display:none">
  <div class="card auth-card">
    <h2>Create account</h2>

    <input id="regEmail" type="email" placeholder="Email">
    <input id="regPassword" type="password" placeholder="Password">

    <button id="nextSignup">Next</button>
    <button id="goLogin1" class="link-btn">Back to login</button>
  </div>
</div>

<!-- SIGNUP STEP 2 -->
<div id="signup-step2" style="display:none">
  <div class="card auth-card">
    <h2>Your details</h2>

    <input id="regFullName" placeholder="Full name">
    <input id="regPhone" placeholder="Phone number">
    <input id="regAddress" placeholder="Home address">
    <input id="regCity" placeholder="City">
    <input id="regState" placeholder="State">
    <input id="regCountry" placeholder="Country">
    <input id="regZip" placeholder="Zip code">

    <button id="signupBtn">Create account</button>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard-container" style="display:none">
  <header class="dash-header">
    <h1>SamaFlux</h1>
    <div class="dash-actions">
      <button id="profileBtn">Profile</button>
      <button id="logoutBtn">Logout</button>
    </div>
  </header>

  <div class="card">
    <p>Balance</p>
    <h2>₦<span id="balance">0</span></h2>
  </div>

  <div class="card">
    <h3>Recent activity</h3>
    <ul id="history"></ul>
  </div>
</div>

<!-- PROFILE (READ ONLY – SAFE) -->
<div id="profile-container" style="display:none">
  <div class="card">
    <h2>My Profile</h2>

    <p><strong>Email:</strong> <span id="p-email">-</span></p>
    <p><strong>Full name:</strong> <span id="p-name">-</span></p>
    <p><strong>Phone:</strong> <span id="p-phone">-</span></p>
    <p><strong>Address:</strong> <span id="p-address">-</span></p>
    <p><strong>City:</strong> <span id="p-city">-</span></p>
    <p><strong>State:</strong> <span id="p-state">-</span></p>
    <p><strong>Country:</strong> <span id="p-country">-</span></p>
    <p><strong>Zip:</strong> <span id="p-zip">-</span></p>

    <button id="backDashboard">Back to dashboard</button>
  </div>
</div>

<script src="app.js?v=4.1" defer></script>
</body>
</html>
