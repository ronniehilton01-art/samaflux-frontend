<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SamaFlux</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css?v=4.2">
  <script src="https://js.paystack.co/v1/inline.js"></script>
</head>
<body>

<!-- LOGIN -->
<div id="auth-container">
  <div class="card auth-card">
    <h2>Log in</h2>
    <input id="loginEmail" type="email" placeholder="Email">
    <input id="loginPassword" type="password" placeholder="Password">
    <button id="loginBtn">Log in</button>
    <button id="goSignup" class="link-btn">Create account</button>
  </div>
</div>

<!-- SIGNUP STEP 1 -->
<div id="signup-step1" style="display:none">
  <div class="card auth-card">
    <h2>Create account</h2>
    <input id="regEmail" type="email" placeholder="Email">
    <input id="regPassword" type="password" placeholder="Password">
    <button id="nextSignup">Next</button>
    <button id="goLogin1" class="link-btn">Back to login</button>
  </div>
</div>

<!-- SIGNUP STEP 2 -->
<div id="signup-step2" style="display:none">
  <div class="card auth-card">
    <h2>Your details</h2>
    <input id="regFullName" placeholder="Full name">
    <input id="regPhone" placeholder="Phone number">
    <input id="regAddress" placeholder="Home address">
    <input id="regCity" placeholder="City">
    <input id="regState" placeholder="State">
    <input id="regCountry" placeholder="Country">
    <input id="regZip" placeholder="Zip code">
    <button id="signupBtn">Create account</button>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard-container" style="display:none">
  <header class="dash-header">
    <h1>SamaFlux</h1>
    <div>
      <button id="addMoneyBtn">Add Money</button>
      <button id="sendMoneyBtn">Send Money</button>
      <button id="logoutBtn">Logout</button>
    </div>
  </header>

  <div class="card">
    <p>Balance</p>
    <h2>₦<span id="balance">0</span></h2>
  </div>

  <div class="card">
    <h3>Recent activity</h3>
    <ul id="history"></ul>
  </div>
</div>

<!-- SEND MONEY -->
<div id="send-page" style="display:none">
  <div class="card auth-card">
    <h2>Send Money</h2>
    <input id="sendToEmail" placeholder="Receiver email">
    <input id="sendAmount" type="number" placeholder="Amount">
    <button id="confirmSendBtn">Send</button>
    <button id="backDash1" class="link-btn">Back</button>
  </div>
</div>

<!-- ADD MONEY -->
<div id="add-page" style="display:none">
  <div class="card auth-card">
    <h2>Add Money</h2>
    <input id="addAmount" type="number" placeholder="Amount">
    <button id="paystackBtn">Pay with Paystack</button>
    <button id="backDash2" class="link-btn">Back</button>
  </div>
</div>

<script src="app.js?v=4.2" defer></script>
</body>
</html>
