<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Samaflux 2026</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="app.js"></script>
</head>

<body>
  <div class="container">

    <!-- AUTH SECTION -->
    <div id="auth" class="card">
      <h2>Welcome to Samaflux</h2>

      <div class="form-group">
        <input id="loginEmail" type="email" placeholder="Email">
        <input id="loginPassword" type="password" placeholder="Password">
        <button onclick="login()" class="btn-primary">Login</button>
      </div>

      <hr>

      <div class="form-group">
        <input id="regEmail" type="email" placeholder="Email">
        <input id="regPassword" type="password" placeholder="Password">
        <button onclick="register()" class="btn-secondary">Register</button>
      </div>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard" class="card" style="display:none">
      <div class="header">
        <h2>Dashboard</h2>
        <button onclick="logout()" class="btn-logout">Logout</button>
      </div>

      <div class="info">
        <p>Email: <span id="userEmail"></span></p>
        <p>Balance: ₦<span id="balance">0</span></p>
      </div>

      <div class="form-group">
        <input id="amount" type="number" placeholder="Amount">
        <button onclick="addMoney()" class="btn-primary">Add Money</button>
      </div>

      <div class="form-group">
        <input id="sendEmail" type="email" placeholder="Recipient Email">
        <input id="sendAmount" type="number" placeholder="Amount">
        <button onclick="sendMoney()" class="btn-secondary">Send Money</button>
      </div>

      <h3>Transactions</h3>
      <ul id="history" class="transactions"></ul>
    </div>
  </div>
</body>

</html>
