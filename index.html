<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SamaFlux</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- CACHE BUSTER -->
  <link rel="stylesheet" href="style.css?v=1.0.3">
</head>
<body>

<div id="page-loader"></div>

<div id="auth-container">
  <div id="auth">
    <h2>Log in to SamaFlux</h2>

    <input id="loginEmail" type="email" placeholder="Email">
    <input id="loginPassword" type="password" placeholder="Password">

    <button id="loginBtn">Log in</button>

    <button id="goSignup" class="link-btn">
      Create account
    </button>
  </div>
</div>

<div id="signup-container" style="display:none">
  <div id="auth">
    <h2>Create account</h2>

    <input id="regEmail" type="email" placeholder="Email">
    <input id="regPassword" type="password" placeholder="Password">

    <button id="signupBtn">Sign up</button>

    <button id="goLogin" class="link-btn">
      Back to login
    </button>
  </div>
</div>

<div id="dashboard-container" style="display:none">
  <h1>SamaFlux Dashboard</h1>
  <p>Balance: ₦<span id="balance">0</span></p>
  <button id="logoutBtn">Logout</button>
</div>

<script src="app.js?v=1.0.3" defer></script>
</body>
</html>
