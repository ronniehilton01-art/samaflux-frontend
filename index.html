<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SamaFlux</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css?v=4.0" />
</head>
<body>

<!-- LOGIN -->
<div id="auth-container" class="center">
  <div class="card auth-card">
    <h2>Log in to SamaFlux</h2>

    <input id="loginEmail" type="email" placeholder="Email" />
    <input id="loginPassword" type="password" placeholder="Password" />

    <button id="loginBtn" class="primary">Log in</button>

    <button id="goSignup" class="link-btn">Create account</button>
  </div>
</div>

<!-- SIGNUP STEP 1 -->
<div id="signup-step1" class="center hidden">
  <div class="card auth-card">
    <h2>Create account</h2>

    <input id="regEmail" type="email" placeholder="Email" />
    <input id="regPassword" type="password" placeholder="Password" />

    <button id="nextSignup" class="primary">Next</button>
    <button id="goLogin1" class="link-btn">Back to login</button>
  </div>
</div>

<!-- SIGNUP STEP 2 -->
<div id="signup-step2" class="center hidden">
  <div class="card auth-card">
    <h2>Your details</h2>

    <input id="regFullName" placeholder="Full name" />
    <input id="regPhone" placeholder="Phone number" />
    <input id="regAddress" placeholder="Home address" />
    <input id="regCity" placeholder="City" />
    <input id="regState" placeholder="State" />
    <input id="regCountry" placeholder="Country" />
    <input id="regZip" placeholder="Zip code" />

    <button id="signupBtn" class="primary">Create account</button>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard-container" class="hidden">
  <header class="dash-header">
    <h1>SamaFlux</h1>

    <div class="header-actions">
      <button id="profileBtn">Profile</button>
      <button id="logoutBtn">Logout</button>
    </div>
  </header>

  <div class="card">
    <p class="label">Balance</p>
    <h2>₦<span id="balance">0</span></h2>
  </div>

  <div class="card">
    <h3>Recent activity</h3>
    <ul id="history"></ul>
  </div>
</div>

<script src="app.js?v=4.0" defer></script>
</body>
</html>
