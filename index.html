<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SamaFlux</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="top-loader"></div>

<!-- PAGE LOADER -->
<div id="page-loader">
  <div class="loader-card">
    <div class="logo">Sama<span>Flux</span></div>
    <div class="bar"><div class="bar-fill"></div></div>
    <p>Processing…</p>
  </div>
</div>

<!-- AUTH -->
<div id="auth-container">
  <div id="auth">
    <h2>Log in to SamaFlux</h2>
    <input id="loginEmail" placeholder="Email" />
    <input id="loginPassword" type="password" placeholder="Password" />
    <button onclick="login()">Log in</button>

    <h3>Create account</h3>
    <input id="regEmail" placeholder="Email" />
    <input id="regPassword" type="password" placeholder="Password" />
    <button class="secondary" onclick="register()">Sign up</button>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard-container" class="page hidden">

  <header class="topbar">
    <h1>SamaFlux</h1>
    <div class="top-actions">
      <button onclick="go('add')">Add</button>
      <button onclick="go('send')">Send</button>
      <button onclick="go('request')">Request</button>
      <button class="logout" onclick="logout()">Logout</button>
    </div>
  </header>

  <section class="balance-card">
    <p>Available balance</p>
    <h2>₦<span id="balance">0</span></h2>
  </section>

  <section class="transactions">
    <h3>Recent activity</h3>
    <ul id="history"></ul>
  </section>
</div>

<!-- ADD MONEY PAGE -->
<div id="add-page" class="page hidden">
  <header class="subbar">
    <button onclick="go('dashboard')">← Back</button>
    <h2>Add money</h2>
  </header>

  <div class="form-card">
    <input id="amount" type="number" placeholder="Amount" />
    <button onclick="addMoney()">Continue</button>
  </div>
</div>

<!-- SEND MONEY PAGE -->
<div id="send-page" class="page hidden">
  <header class="subbar">
    <button onclick="go('dashboard')">← Back</button>
    <h2>Send money</h2>
  </header>

  <div class="form-card">
    <input id="sendEmail" placeholder="Recipient email" />
    <input id="sendAmount" type="number" placeholder="Amount" />
    <button onclick="sendMoney()">Send</button>
  </div>
</div>

<!-- REQUEST MONEY PAGE -->
<div id="request-page" class="page hidden">
  <header class="subbar">
    <button onclick="go('dashboard')">← Back</button>
    <h2>Request money</h2>
  </header>

  <div class="form-card">
    <input id="requestEmail" placeholder="User email" />
    <input id="requestAmount" type="number" placeholder="Amount" />
    <button onclick="requestMoney()">Request</button>
  </div>
</div>

<div id="toast-container"></div>

<script src="app.js"></script>
</body>
</html>
