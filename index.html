<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SamaFlux</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

<!-- TOP PROGRESS BAR -->
<div id="top-loader"></div>

<!-- FULLSCREEN LOADER -->
<div id="page-loader">
  <div class="loader-card">
    <div class="logo">Sama<span>Flux</span></div>
    <div class="bar">
      <div class="bar-fill"></div>
    </div>
    <p>Processing…</p>
  </div>
</div>

<div id="auth-container">
  <div id="auth">
    <h2>Log in to SamaFlux</h2>

    <input id="loginEmail" type="email" placeholder="Email"/>
    <input id="loginPassword" type="password" placeholder="Password"/>

    <button onclick="login()">Log In</button>

    <h3>Create account</h3>
    <input id="regEmail" type="email" placeholder="Email"/>
    <input id="regPassword" type="password" placeholder="Password"/>

    <button class="secondary" onclick="register()">Sign Up</button>
  </div>
</div>

<div id="dashboard-container" style="display:none">

  <header class="topbar">
    <h1>SamaFlux</h1>
    <div class="top-actions">
      <button onclick="addMoney()">Add money</button>
      <button onclick="sendMoney()">Send</button>
      <button onclick="requestMoney()">Request</button>
      <button class="logout" onclick="logout()">Log out</button>
    </div>
  </header>

  <section class="balance-card">
    <p>Available balance</p>
    <h2>₦<span id="balance">0</span></h2>
  </section>

  <section class="cards">
    <div class="card">
      <h3>Add money</h3>
      <input id="amount" type="number" placeholder="Amount"/>
    </div>

    <div class="card">
      <h3>Send money</h3>
      <input id="sendEmail" type="email" placeholder="Recipient email"/>
      <input id="sendAmount" type="number" placeholder="Amount"/>
    </div>
  </section>

  <section class="transactions">
    <h3>Recent activity</h3>
    <ul id="history"></ul>
  </section>

</div>

<div id="toast-container"></div>

<script src="app.js"></script>
</body>
</html>
