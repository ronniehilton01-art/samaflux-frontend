<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SamaFlux</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="auth-container">
  <div class="card">
    <h2>Log in</h2>
    <input id="loginEmail" type="email" placeholder="Email" />
    <input id="loginPassword" type="password" placeholder="Password" />
    <button id="loginBtn">Log in</button>
  </div>
</div>

<!-- ================= DASHBOARD ================= -->
<div id="dashboard-container" style="display:none">

  <!-- HEADER -->
  <header class="dash-header">
    <h1>SamaFlux</h1>
    <div class="dash-actions">
      <button id="addFundsBtn">Add Funds</button>
      <button id="sendMoneyBtn">Send Money</button>
      <button id="profileBtn">Profile</button>
      <button id="logoutBtn">Logout</button>
    </div>
  </header>

  <!-- ================= MAIN DASHBOARD ================= -->
  <section id="main-dashboard">
    <div class="card">
      <p>Balance</p>
      <h2>₦<span id="balance">0</span></h2>
    </div>

    <div class="card">
      <h3>Recent Activity</h3>
      <ul id="history"></ul>
    </div>
  </section>

  <!-- ================= ADD FUNDS ================= -->
  <section id="add-funds-page" style="display:none">
    <div class="card">
      <h3>Add Funds</h3>
      <input id="fundAmount" type="number" placeholder="Amount" />
      <button id="paystackBtn">Add Funds</button>
      <button id="backFromAdd" class="link-btn">Back to dashboard</button>
    </div>
  </section>

  <!-- ================= SEND MONEY ================= -->
  <section id="send-money-page" style="display:none">
    <div class="card">
      <h3>Send Money</h3>
      <input id="sendTo" type="email" placeholder="Recipient email" />
      <input id="sendAmount" type="number" placeholder="Amount" />
      <button id="sendBtn">Send</button>
      <button id="backFromSend" class="link-btn">Back to dashboard</button>
    </div>
  </section>

  <!-- ================= PROFILE ================= -->
  <section id="profile-page" style="display:none">
    <div class="card">
      <h3>Profile</h3>
      <p><b>Name:</b> <span id="pName">-</span></p>
      <p><b>Email:</b> <span id="pEmail">-</span></p>
      <p><b>Phone:</b> <span id="pPhone">-</span></p>
      <p><b>Address:</b> <span id="pAddress">-</span></p>
      <button id="backFromProfile" class="link-btn">Back to dashboard</button>
    </div>
  </section>

  <!-- ================= ADD FUNDS SUCCESS ================= -->
  <section id="add-success-page" style="display:none">
    <div class="card">
      <h3>Success 🎉</h3>
      <p>
        Funds added successfully.<br />
        Amount: <b>₦<span id="addedAmount">0</span></b>
      </p>
      <button id="backAfterAdd" class="link-btn">Back to dashboard</button>
    </div>
  </section>

  <!-- ================= SEND MONEY SUCCESS ================= -->
  <section id="send-success-page" style="display:none">
    <div class="card">
      <h3>Transfer Successful ✅</h3>
      <p>
        You sent <b>₦<span id="sentAmount">0</span></b><br />
        To <b><span id="sentToEmail">-</span></b>
      </p>
      <button id="backAfterSend" class="link-btn">Back to dashboard</button>
    </div>
  </section>

</div>

<script src="app.js"></script>
</body>
</html>
