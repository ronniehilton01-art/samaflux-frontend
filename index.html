<!-- DASHBOARD -->
<div id="dashboard-container" style="display:none">

  <!-- HEADER -->
  <header class="dash-header">
    <h1>SamaFlux</h1>

    <div class="dash-actions">
      <button id="addFundsBtn">Add Funds</button>
      <button id="sendMoneyBtn">Send Money</button>
      <button id="profileBtn">Profile</button>
      <button id="logoutBtn">Logout</button>
    </div>
  </header>

  <!-- ================= MAIN DASHBOARD ================= -->
  <section id="main-dashboard">
    <div class="card">
      <p>Balance</p>
      <h2>₦<span id="balance">0</span></h2>
    </div>

    <div class="card">
      <h3>Recent Activity</h3>
      <ul id="history"></ul>
    </div>
  </section>

  <!-- ================= ADD FUNDS ================= -->
  <section id="add-funds-page" style="display:none">
    <div class="card">
      <h3>Add Funds</h3>

      <input
        id="fundAmount"
        type="number"
        placeholder="Amount"
      >

      <button id="paystackBtn">Add Funds</button>

      <button id="backFromAdd" class="link-btn">
        Back to dashboard
      </button>
    </div>
  </section>

  <!-- ================= SEND MONEY ================= -->
  <section id="send-money-page" style="display:none">
    <div class="card">
      <h3>Send Money</h3>

      <input
        id="sendTo"
        type="email"
        placeholder="Recipient email"
      >

      <input
        id="sendAmount"
        type="number"
        placeholder="Amount"
      >

      <button id="sendBtn">Send</button>

      <button id="backFromSend" class="link-btn">
        Back to dashboard
      </button>
    </div>
  </section>

  <!-- ================= PROFILE ================= -->
  <section id="profile-page" style="display:none">
    <div class="card">
      <h3>Profile</h3>

      <p><strong>Name:</strong> <span id="pName">-</span></p>
      <p><strong>Email:</strong> <span id="pEmail">-</span></p>
      <p><strong>Phone:</strong> <span id="pPhone">-</span></p>
      <p><strong>Address:</strong> <span id="pAddress">-</span></p>

      <button id="backFromProfile" class="link-btn">
        Back to dashboard
      </button>
    </div>
  </section>

</div>
